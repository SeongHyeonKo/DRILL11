  <path class="edge" d="M450 310 V208"/>
  <text class="label" x="505" y="266">LEFT / RIGHT down</text>

  <text x="470" y="414" text-anchor="middle" font-size="12" fill="#64748b">AUTO_RUN: 5 seconds, faster and enlarged, edge bounce, invincibility flag</text>
