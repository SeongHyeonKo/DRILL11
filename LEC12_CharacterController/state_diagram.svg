<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: sans-serif; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.3; marker-end: url(#arrow); }
      .label { font-size: 13px; fill: #475569; }
    </style>
  </defs>
  <rect width="940" height="440" rx="18" fill="#f8fafc"/>
  <text x="470" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Boy State Machine</text>

  <circle cx="38" cy="164" r="7" fill="#0f172a"/>
  <path class="edge" d="M45 164 H86"/>

  <rect x="100" y="128" width="140" height="72" rx="36" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="170" y="171" text-anchor="middle" font-size="21" font-weight="700" fill="#1e3a8a">IDLE</text>
  <rect x="380" y="128" width="140" height="72" rx="36" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="450" y="171" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">RUN</text>
  <rect x="665" y="128" width="185" height="72" rx="36" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="757" y="171" text-anchor="middle" font-size="20" font-weight="700" fill="#6b21a8">AUTO_RUN</text>
  <rect x="380" y="310" width="140" height="72" rx="36" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="450" y="353" text-anchor="middle" font-size="21" font-weight="700" fill="#92400e">SLEEP</text>

  <path class="edge" d="M240 148 H372"/>
  <text class="label" x="306" y="139" text-anchor="middle">LEFT / RIGHT down</text>
  <path class="edge" d="M380 183 H248"/>
  <text class="label" x="314" y="220" text-anchor="middle">all direction keys up</text>

  <path class="edge" d="M172 128 C215 66 714 66 754 120"/>
